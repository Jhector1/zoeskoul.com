name: ZoeBuild U20H Runner candidate (build-only)

# Explicit request: commit a change to the dedicated .request file on the
# isolated HMR feature branch. No build runs for ordinary source pushes.
on:
  push:
    branches:
      - feat/zoebuild-hmr-phase4f1-rc1
    paths:
      - .github/workflows/zoebuild-u20h-runner-build.request

permissions:
  contents: read
  packages: write

concurrency:
  group: zoebuild-u20h-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-candidate:
    name: Verify and publish isolated Runner candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: postgresql://zoeskoul:zoeskoul@localhost:5432/zoeskoul?schema=public
    steps:
      - name: Check out triggering commit exactly
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3

      - name: Verify source and build scope
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_REF: refs/heads/feat/zoebuild-hmr-phase4f1-rc1
          EXPECTED_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "${EXPECTED_REPO%%/*}" = 'Jhector1' || test "${EXPECTED_REPO%%/*}" = 'jhector1'
          test -z "$(git status --porcelain)"
          test -f apps/runner/Dockerfile
          test -f .dockerignore
          python3 - <<'CANDIDATE_MANIFEST_PY'
          import hashlib, json, re, subprocess
          from pathlib import Path, PurePosixPath

          def check(ok, label):
              if not ok:
                  raise SystemExit(label)

          def git(*args):
              return subprocess.check_output(["git", *args]).decode().strip()

          def changed(a, b):
              return set(filter(None, subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", a, b]).decode().split("\0")))

          request_path = '.github/workflows/zoebuild-u20h-runner-build.request'
          request = json.loads(Path(request_path).read_text())
          check(set(request) == {"schema", "source", "sourceTree", "base", "changedPaths", "sha256", "requestedAtUtc"} and request["schema"] == 1, "REQUEST_SCHEMA_INVALID")
          for name in ("source", "sourceTree", "base"):
              check(isinstance(request[name], str) and re.fullmatch(r"[0-9a-f]{40}", request[name]), "REQUEST_ID_INVALID")
          source, base = request["source"], request["base"]
          check(git("rev-parse", "HEAD^") == source and git("rev-parse", source + "^") == base, "REQUEST_PARENT_MISMATCH")
          check(git("rev-parse", source + "^{tree}") == request["sourceTree"], "SOURCE_TREE_MISMATCH")
          check(changed(source, "HEAD") == {request_path}, "REQUEST_COMMIT_SCOPE_INVALID")
          check(isinstance(request["changedPaths"], list) and changed(base, source) == set(request["changedPaths"]), "SOURCE_SCOPE_MISMATCH")
          manifest = request["sha256"]
          check(isinstance(manifest, dict) and set(['.dockerignore', '.github/workflows/zoebuild-u20h-runner-candidate.yml', 'apps/runner/Dockerfile', 'apps/runner/src/routes/build.previews.developmentUpdate.test.ts', 'apps/runner/src/routes/build.previews.developmentUpdate.ts', 'apps/runner/src/services/build/previewDependencyLayerStore.test.ts', 'apps/runner/src/services/build/previewDependencyLayerStore.ts', 'apps/runner/src/services/build/previewDependencyVerity.py', 'apps/runner/src/services/build/previewDependencyVerity.ts', 'apps/runner/src/services/build/previewDependencyVerity_test.py', 'apps/runner/src/services/build/tanstackDevelopmentPreviewAdmission.test.ts', 'apps/runner/src/services/build/tanstackDevelopmentPreviewAdmission.ts', 'apps/runner/src/services/build/tanstackDevelopmentSourceStore.ts', 'apps/runner/src/services/build/tanstackDevelopmentWorkspaceWriter.test.ts', 'apps/runner/src/services/build/tanstackDevelopmentWorkspaceWriter.ts', 'apps/runner/src/services/build/tanstackPreviewDockerDriver.ts', 'apps/runner/src/services/build/tanstackPreviewIdentity.test.ts', 'apps/runner/src/services/build/tanstackPreviewIdentity.ts', 'apps/runner/src/services/build/tanstackWorkerBuild.ts', 'apps/runner/src/services/build/tanstackWorkerRuntimePolicy.test.ts', 'apps/runner/src/services/build/tanstackWorkerRuntimePolicy.ts', 'apps/runner/src/services/build/tanstackWorkerRuntimeSmoke.test.ts', 'apps/runner/src/services/build/tanstackWorkerRuntimeSmoke.ts', 'apps/runner/src/services/workspace/workspacePolicy.disk.test.ts', 'apps/runner/src/services/workspace/workspacePolicy.ts', 'apps/runner/src/services/workspace/workspaceStrictUsageWorker.ts', 'apps/zoebuild/src/app/api/build/projects/[buildProjectId]/preview/[previewId]/development/update/route.test.ts', 'apps/zoebuild/src/lib/build/reactPreviewDevelopmentBrowserBoundary.ts', 'apps/zoebuild/src/lib/build/reactPreviewDevelopmentBrowserSession.ts', 'packages/build-executor-contracts/src/index.test.ts', 'packages/build-executor-contracts/src/index.ts', 'packages/build-executor-contracts/src/tanstackLivePreviewTransition.binary.test.ts', 'packages/build-executor-contracts/src/tanstackLivePreviewTransition.test.ts', 'packages/build-executor-contracts/src/tanstackLivePreviewTransition.ts', 'packages/build-preparation/src/index.ts', 'packages/build-preparation/src/productionBuildJob.test.ts', 'pnpm-lock.yaml']) <= set(manifest), "REQUIRED_PINS_MISSING")
          for name, digest in manifest.items():
              path = PurePosixPath(name)
              check(not path.is_absolute() and str(path) == name and ".." not in path.parts and name != request_path, "PIN_PATH_INVALID")
              check(isinstance(digest, str) and re.fullmatch(r"[0-9a-f]{64}", digest), "PIN_DIGEST_INVALID")
              p = Path(name)
              check(p.is_file() and not p.is_symlink() and not any(x.is_symlink() for x in p.parents), "PIN_FILE_INVALID")
              check(hashlib.sha256(p.read_bytes()).hexdigest() == digest, "SOURCE_DRIFT=" + name)
          print(f"CANDIDATE_SOURCE_MANIFEST=PASS ({len(manifest)} files)")
          CANDIDATE_MANIFEST_PY
          echo 'CANDIDATE_ONLY=YES'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install lockfile-verified dependencies
        run: pnpm install --frozen-lockfile

      - name: Build required Runner and ZoeBuild workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter '@zoeskoul/runner^...' build
          pnpm --filter @zoeskoul/db run build
          pnpm --filter @zoeskoul/curriculum-contracts run build
          pnpm --filter @zoeskoul/curriculum-core run build
          (cd packages/curriculum-registry && node scripts/generate-published-runtime.mjs)
          pnpm --filter @zoeskoul/curriculum-registry exec tsc -p tsconfig.json
          pnpm --filter @zoeskoul/curriculum-runtime exec tsc -p tsconfig.json
          test -f packages/db/dist/index.d.ts
          test -f packages/curriculum-registry/dist/runtime/index.d.ts
          test -f packages/curriculum-runtime/dist/index.d.ts

      - name: U20H Runner and browser boundary targeted regression tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/runner exec vitest run \
            src/services/build/tanstackDevelopmentPreviewAdmission.test.ts \
            src/services/build/tanstackDevelopmentWorkspaceWriter.test.ts \
            src/routes/build.previews.developmentUpdate.test.ts
          pnpm --dir apps/zoebuild exec vitest run \
            'src/app/api/build/projects/[buildProjectId]/preview/[previewId]/development/update/route.test.ts' \
            src/lib/build/reactPreviewDevelopmentBrowserSession.test.ts
          pnpm --dir apps/runner exec vitest run --config vitest.config.ts src/services/workspace/workspacePolicy.disk.test.ts src/services/workspace/workspacePolicy.test.ts src/services/workspace/createWorkspace.test.ts src/services/workspace/workspaceFilesystemPolicy.test.ts src/services/workspace/workspaceDependencyPermissionsK20D3F1.test.ts src/services/build/previewDependencyLayerStore.test.ts src/services/build/tanstackPreviewDependencyReuse.test.ts src/services/build/tanstackWorkerRuntimePolicy.test.ts src/services/build/tanstackWorkerRuntimeSmoke.test.ts
          python3 -B apps/runner/src/services/build/previewDependencyVerity_test.py
          pnpm --dir apps/runner exec tsc --noEmit
          pnpm --dir apps/zoebuild exec tsc --noEmit

      - name: Lowercase trusted package owner
        id: owner
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          test "$owner" = 'jhector1'
          echo "name=$owner" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish U20H immutable Runner candidate ONLY
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/runner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/zoeskoul-runner:u20h-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            zoebuild.release=u20h-binary-hmr-candidate
          cache-from: type=gha,scope=zoebuild-u20h-runner
          cache-to: type=gha,mode=max,scope=zoebuild-u20h-runner

      - name: Show candidate digest (never deploy)
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          OWNER: ${{ steps.owner.outputs.name }}
          SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo '### U20H Runner-only candidate built'
            printf -- '- Source SHA: `%s`\n' "$SOURCE"
            printf -- '- Tag: `ghcr.io/%s/zoeskoul-runner:u20h-%s`\n' "$OWNER" "$SOURCE"
            printf -- '- Immutable digest: `%s`\n' "$DIGEST"
            echo '- Deploys: **none** (no VM, Compose, runtime or production changes)'
            echo '- Binary HMR remains operator-disabled on the currently running Runner'
          } >> "$GITHUB_STEP_SUMMARY"
