name: Build production images

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      build_web:
        description: "Also build and push the web Docker image"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write

jobs:
  prepare-node-base:
    name: Prepare shared Node base mirror
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure ZoeSkoul Node base mirror
        shell: bash
        env:
          NODE_BASE_MIRROR: ghcr.io/jhector1/zoeskoul-node-base:22-bookworm-slim
          NODE_BASE_UPSTREAM: public.ecr.aws/docker/library/node:22-bookworm-slim
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$NODE_BASE_MIRROR" >/dev/null 2>&1; then
            echo "Node base mirror already present in GHCR."
          else
            echo "Node base mirror missing; seeding from AWS Public ECR Docker Official Images."
            docker buildx imagetools create \
              --tag "$NODE_BASE_MIRROR" \
              "$NODE_BASE_UPSTREAM"
          fi
          docker buildx imagetools inspect "$NODE_BASE_MIRROR"

  build:
    name: Build ${{ matrix.image }} image
    needs: prepare-node-base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            repository: zoeskoul-web
            dockerfile: apps/web/Dockerfile
          - image: runner
            repository: zoeskoul-runner
            dockerfile: apps/runner/Dockerfile
          - image: runtime
            repository: zoeskoul-runtime
            dockerfile: apps/runner/runtime/Dockerfile
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Compute lowercase owner
        id: owner
        shell: bash
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Manual dispatch retains the old build_web choice. Pushes always build all 3.
      # Build candidates use SHA-only tags; 'prod' is updated ONLY by promotion.
      - name: Build and publish immutable image
        id: publish
        if: >-
          matrix.image != 'web' ||
          github.event_name == 'push' ||
          inputs.build_web == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner_lc }}/${{ matrix.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Record published candidate digest
        if: steps.publish.outcome == 'success'
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.owner_lc }}/${{ matrix.repository }}:${{ github.sha }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "ERROR: no valid digest was returned by the image publisher" >&2
            exit 1
          }
          {
            echo "### Published immutable ${{ matrix.image }} candidate"
            echo "- Reference: \`$IMAGE\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Production tag unchanged; promote through the manual workflow"
          } >> "$GITHUB_STEP_SUMMARY"
