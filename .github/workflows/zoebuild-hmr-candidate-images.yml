name: ZoeBuild HMR Runner candidate image

# This workflow is source-locked and Runner-only. Merely updating it does
# not publish an image. Explicit requests on the isolated branch must change
# the dedicated runner-build request file. Manual dispatch becomes available
# when GitHub registers this workflow on the repository default branch.
on:
  push:
    branches:
      - feat/zoebuild-hmr-phase4f1-rc1
    paths:
      - .github/workflows/zoebuild-hmr-runner-build.request
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: zoebuild-hmr-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-images:
    name: Build ${{ matrix.component }} (source-locked)
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: runner
            dockerfile: apps/runner/Dockerfile
            repository: zoeskoul-runner
    env:
      RELEASE_SHA: f4ebfeca9a7f9dea02f70ea3c6d60a02bbb4e083
    steps:
      - name: Check out exact validated release commit
        uses: actions/checkout@v4
        with:
          ref: f4ebfeca9a7f9dea02f70ea3c6d60a02bbb4e083
          persist-credentials: false

      - name: Verify Git provenance and Dockerfile
        shell: bash
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -f "$DOCKERFILE"
          test "$(git status --porcelain | wc -l | tr -d ' ')" = '0'
          echo "COMMITTED_SOURCE=$RELEASE_SHA"
          echo "SOURCE_DOCKERFILE=$DOCKERFILE"

      - name: Lowercase image owner
        id: owner
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Buildx on GitHub Linux runner
        uses: docker/setup-buildx-action@v3

      - name: Build and publish only this immutable candidate
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.repository }}:${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            zoebuild.release=hmr-phase4f4b-candidate
          cache-from: type=gha,scope=zoebuild-hmr-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=zoebuild-hmr-${{ matrix.component }}

      - name: Record immutable image digest
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          REPOSITORY: ${{ matrix.repository }}
          OWNER: ${{ steps.owner.outputs.name }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          {
            echo "### $REPOSITORY candidate"
            printf -- '- Source: `%s`\n' "$RELEASE_SHA"
            printf -- '- Tag: `ghcr.io/%s/%s:%s`\n' "$OWNER" "$REPOSITORY" "$RELEASE_SHA"
            printf -- '- Digest: `%s`\n' "$DIGEST"
            echo '- No Ubuntu deployment or production tag was changed'
          } >> "$GITHUB_STEP_SUMMARY"
