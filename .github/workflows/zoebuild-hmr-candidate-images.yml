name: ZoeBuild U18 Runner candidate image
on:
  push:
    branches: [feat/zoebuild-u18-runner-release]
    paths: [.github/workflows/zoebuild-hmr-runner-build.request]
permissions:
  contents: read
  packages: write
concurrency:
  group: zoebuild-u18-runner-release
  cancel-in-progress: false
jobs:
  candidate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      RELEASE_SHA: 8e610b727cadc88cfc2d535e22a7616e372d3d46
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8e610b727cadc88cfc2d535e22a7616e372d3d46
          persist-credentials: false
      - name: Verify source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"
          test -f apps/runner/Dockerfile
          echo "COMMITTED_SOURCE=$RELEASE_SHA"
      - name: Resolve registry owner
        id: owner
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish Runner candidate
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/runner/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ steps.owner.outputs.name }}/zoeskoul-runner:sha-8e610b727cadc88cfc2d535e22a7616e372d3d46
          labels: |
            org.opencontainers.image.revision=8e610b727cadc88cfc2d535e22a7616e372d3d46
      - name: Record immutable image identity
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "U18_RELEASE_SHA=$RELEASE_SHA"
          echo "U18_IMAGE_DIGEST=$IMAGE_DIGEST"
          printf '## U18 Runner candidate\nSource: %s\nDigest: %s\n' "$RELEASE_SHA" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
