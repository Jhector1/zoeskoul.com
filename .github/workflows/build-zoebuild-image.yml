name: Build ZoeBuild main images (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify committed source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Normalize registry owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build ZoeBuild app (immutable SHA tag only)
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/zoebuild/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/zoeskoul-zoebuild:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build signer (immutable SHA tag only)
        id: signer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: zoe-infra/hosts/zoebuild/ingress-signer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/zoeskoul-zoebuild-ingress-signer:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify and record image digests
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          SIGNER_DIGEST: ${{ steps.signer.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$APP_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$SIGNER_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'Source: %s\nApp: %s\nSigner: %s\n' "$GITHUB_SHA" "$APP_DIGEST" "$SIGNER_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  runner:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify committed source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Normalize registry owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build Runner (immutable SHA tag only)
        id: runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/runner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/zoeskoul-runner:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify and record Runner digest
        env:
          RUNNER_DIGEST: ${{ steps.runner.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'Source: %s\nRunner: %s\n' "$GITHUB_SHA" "$RUNNER_DIGEST" >> "$GITHUB_STEP_SUMMARY"
