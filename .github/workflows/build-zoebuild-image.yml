name: Build ZoeBuild shared-host images (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize registry owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build ZoeBuild app (immutable SHA tag only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/zoebuild/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/zoeskoul-zoebuild:${{ github.sha }}
      - name: Build signer (immutable SHA tag only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: zoe-infra/hosts/zoebuild/ingress-signer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/zoeskoul-zoebuild-ingress-signer:${{ github.sha }}
