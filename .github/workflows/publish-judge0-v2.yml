name: Publish Judge0 cgroup v2 image

on:
  push:
    branches: [main]
    paths:
      - 'zoe-infra/hosts/runner/zoeskoul-learning/judge0-v2/**'
      - '.github/workflows/publish-judge0-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve lowercase package name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zoeskoul-judge0" >> "$GITHUB_OUTPUT"
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish both mutable dev tag and immutable commit tag
        uses: docker/build-push-action@v6
        with:
          context: zoe-infra/hosts/runner/zoeskoul-learning/judge0-v2
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:cgv2-dev
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
