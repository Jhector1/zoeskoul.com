name: ZoeBuild private publishing runtime (build only)
on:
  push:
    branches: [feat/zoebuild-hmr-phase4f1-rc1]
    paths:
      - '.github/workflows/zoebuild-publish-pilot.yml'
      - 'zoe-infra/hosts/zoebuild/publish-pilot/**'
      - 'apps/runner/src/services/build/tanstackWorkerRuntimePolicy.ts'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable pilot candidate locally on GitHub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: zoe-infra/hosts/zoebuild/publish-pilot/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/jhector1/zoeskoul-publish-pilot:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Test artifact policy and real isolated Worker execution
        shell: bash
        run: |
          set -Eeuo pipefail
          cd zoe-infra/hosts/zoebuild/publish-pilot
          python3 pilot.py self-test
          python3 pilot.py image-smoke --image "ghcr.io/jhector1/zoeskoul-publish-pilot:$GITHUB_SHA"
      - name: Publish tested candidate (no prod tags or deployment)
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="ghcr.io/jhector1/zoeskoul-publish-pilot:$GITHUB_SHA"
          docker push "$IMAGE"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE" | awk '/^Digest:/ {print $2}')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '### Private pilot runtime\n- Image: `%s`\n- Digest: `%s`\n- Production services: unchanged\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
