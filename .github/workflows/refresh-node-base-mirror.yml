name: Refresh Node base mirror

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: refresh-node-base-mirror
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Refresh mirrored Node base
        shell: bash
        env:
          NODE_BASE_MIRROR: ghcr.io/jhector1/zoeskoul-node-base:22-bookworm-slim
          NODE_BASE_UPSTREAM: public.ecr.aws/docker/library/node:22-bookworm-slim
        run: |
          set -euo pipefail

          echo "source=$NODE_BASE_UPSTREAM"
          echo "destination=$NODE_BASE_MIRROR"

          docker buildx imagetools create \
            --tag "$NODE_BASE_MIRROR" \
            "$NODE_BASE_UPSTREAM"

          docker buildx imagetools inspect "$NODE_BASE_MIRROR"
