# WEB-HOST-ONLY opt-in overlay. Run with the existing web docker-compose.yml.
# Never include this overlay in runner-host Compose commands.
# Image tags are immutable Git SHAs selected separately from zoeskoul-web:prod.
services:
  zoebuild:
    image: ghcr.io/${GHCR_OWNER:?required}/zoeskoul-zoebuild:${ZOEBUILD_IMAGE_TAG:?required}
    restart: unless-stopped
    env_file:
      - .env.zoebuild.app
    environment:
      NODE_ENV: production
      ZOEBUILD_BUYER_IP_SIGNING_KEY: ${ZOEBUILD_BUYER_IP_SIGNING_KEY:?required}
      ZOEBUILD_SHOPIFY_OAUTH_ROUTES_ENABLED: "false"
      ZOEBUILD_SHOPIFY_ACCEPTANCE_RUNTIME_GATE: ""
      ZOEBUILD_PUBLISH_ENABLED: "false"
    expose:
      - "3004"
    networks:
      - webnet
      - zoebuild_private
      - zoebuild_outbound
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 384
    mem_limit: ${ZOEBUILD_APP_MEM_LIMIT:-768m}
    cpus: ${ZOEBUILD_APP_CPUS:-0.5}
    logging: &zoebuild_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const http=require('http');const r=http.get('http://127.0.0.1:3004/',s=>process.exit(s.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(5000,()=>{r.destroy();process.exit(1)});"
      interval: 20s
      timeout: 7s
      retries: 10
      start_period: 45s

  zoebuild-ingress-signer:
    image: ghcr.io/${GHCR_OWNER:?required}/zoeskoul-zoebuild-ingress-signer:${ZOEBUILD_IMAGE_TAG:?required}
    restart: unless-stopped
    environment:
      ZOEBUILD_EDGE_SHARED_SECRET: ${ZOEBUILD_EDGE_SHARED_SECRET:?required}
      ZOEBUILD_BUYER_IP_SIGNING_KEY: ${ZOEBUILD_BUYER_IP_SIGNING_KEY:?required}
    expose:
      - "8090"
    networks:
      - zoebuild_private
      - public
    depends_on:
      zoebuild:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.2
    logging: *zoebuild_logging
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8090/_zoebuild_internal/health',r=>process.exit(r.statusCode===204?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  zoebuild_private:
    internal: true
  zoebuild_outbound:
    driver: bridge
