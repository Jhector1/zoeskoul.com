services:
  web:
    image: ghcr.io/${GHCR_OWNER:?required}/zoeskoul-web:${IMAGE_TAG:-prod}
    container_name: zoeskoul-web
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - /opt/zoeskoul/secrets/google-tts-service-account.json:/run/secrets/google-tts-service-account.json:ro

    expose:
      - "3000"

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - webnet
      - public
      - database_private

    logging: &default_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

    pids_limit: 768
    mem_limit: ${WEB_MEM_LIMIT:-1536m}
    cpus: ${WEB_CPUS:-1.5}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.get('http://127.0.0.1:3000/',res=>process.exit(res.statusCode<500?0:1));req.on('error',()=>process.exit(1));req.setTimeout(5000,()=>{req.destroy();process.exit(1)});\""
        ]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 45s

  social-challenge-scheduler:
    image: ghcr.io/${GHCR_OWNER:?required}/zoeskoul-web:${IMAGE_TAG:-prod}
    container_name: zoeskoul-social-challenge-scheduler
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      web:
        condition: service_healthy

    entrypoint: ["node", "-e"]
    command:
      - |
        const secret = (process.env.ZOESKOUL_SOCIAL_SCHEDULER_SECRET || "").trim();
        if (!secret) {
          console.log("Daily challenge social scheduler disabled: secret not configured.");
          setInterval(() => {}, 3600000);
        } else {
          const tick = async () => {
            try {
              const response = await fetch("http://web:3000/api/internal/public-challenges/social/tick", {
                method: "POST",
                headers: { authorization: "Bearer " + secret },
              });
              if (!response.ok) {
                console.error("Daily challenge social tick failed with HTTP " + response.status);
              }
            } catch (error) {
              console.error(
                "Daily challenge social tick request failed:",
                error instanceof Error ? error.message : String(error),
              );
            }
          };
          void tick();
          setInterval(() => void tick(), 60000);
        }

    networks:
      - webnet
      - database_private

    logging: *default_logging

    security_opt:
      - no-new-privileges:true

    pids_limit: 64
    mem_limit: 128m
    cpus: 0.15

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
      - --requirepass
      - ${REDIS_PASSWORD:?required}

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - webnet

    logging: *default_logging

    security_opt:
      - no-new-privileges:true

networks:
  database_private:
    external: true
    name: zoeskoul_db_private
  webnet:
    driver: bridge

  public:
    external: true
    name: public

volumes:
  redis_data:
