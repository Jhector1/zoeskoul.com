# This file supplements the committed (SHA-pinned) ZoeBuild Compose file.
# Separate zoebuild-stage project, no shared runner or public host socket.
services:
  zoebuild-http-test:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:13004:8080'
    environment:
      ZOEBUILD_EDGE_SHARED_SECRET: ${ZOEBUILD_EDGE_SHARED_SECRET:?required}
    volumes:
      - ${ZOEBUILD_STAGE_CADDYFILE:?required}:/etc/caddy/Caddyfile:ro
    depends_on:
      zoebuild-ingress-signer:
        condition: service_healthy
    networks:
      - public
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.10
networks:
  public:
    external: true
    name: zoebuild-stage-public
