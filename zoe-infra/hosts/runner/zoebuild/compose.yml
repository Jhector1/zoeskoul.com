# ZoeBuild isolated runner; no Judge0, no external ports, dedicated rootless Docker socket.
name: ${COMPOSE_PROJECT_NAME:-zoebuild-runner}
services:
  runner:
    extends:
      file: ../shared/runner-service.yml
      service: runner-base
    env_file:
    - .env
    environment:
      JUDGE0_URL: http://127.0.0.1:9
      # Trusted package-lock bootstrap ONLY; no change to Learning sandboxes.
      RUNNER_BOOTSTRAP_MEMORY_LIMIT_MB: ${RUNNER_BOOTSTRAP_MEMORY_LIMIT_MB:-1024}
    networks:
      ingress:
        aliases:
        - zoebuild-runner
networks:
  ingress:
    external: true
    name: ${RUNNER_INGRESS_NETWORK:-zoeskoul-runner-ingress}
